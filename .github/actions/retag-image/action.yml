name: 'Retag Docker Image for Production'
description: 'Pull dev image, retag for prod (remove branch suffix), push'

inputs:
  docker_repo_user:
    description: 'Docker Hub username'
    required: true
  docker_repo_password:
    description: 'Docker Hub password'
    required: true
  image_name:
    description: 'Docker image name'
    required: true
  gitops_token:
    description: 'GitHub token with repo access to svd-cicd'
    required: true
  gitops_dev_app_name:
    description: 'Dev app name in argocd-applications/values.yaml whose currently deployed tag will be promoted'
    required: true

outputs:
  prod_tag:
    description: 'Generated prod tag (timestamp only, no branch)'
    value: ${{ steps.retag.outputs.prod_tag }}

runs:
  using: 'composite'
  steps:
    - name: Checkout svd-cicd repo
      uses: actions/checkout@v7
      with:
        repository: Servicios-de-Venta-Directa/svd-cicd.git
        ref: main
        token: ${{ inputs.gitops_token }}
        path: gitops-checkout

    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Read currently deployed dev tag
      id: dev_tag
      shell: bash
      working-directory: gitops-checkout/argocd
      env:
        GITOPS_APP_NAME: ${{ inputs.gitops_dev_app_name }}
      run: |
        DEV_TAG=$(yq ".apps[] | select(.name == \"$GITOPS_APP_NAME\") | .tag" argocd-applications/values.yaml)
        if [[ -z "$DEV_TAG" || "$DEV_TAG" == "null" ]]; then
          echo "No deployed tag found for app $GITOPS_APP_NAME" >&2
          exit 1
        fi
        echo "tag=$DEV_TAG" >> "$GITHUB_OUTPUT"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker_repo_user }}
        password: ${{ inputs.docker_repo_password }}

    - name: Retag and push for prod
      id: retag
      shell: bash
      env:
        DOCKER_REPO_USER: ${{ inputs.docker_repo_user }}
        IMAGE_NAME: ${{ inputs.image_name }}
        DEV_TAG: ${{ steps.dev_tag.outputs.tag }}
      run: |
        # Extract prod tag (everything before first dash that's not in timestamp)
        # YYYYMMDDHHmmss has no dashes, so first dash marks branch
        # e.g., 20260709124530-develop → 20260709124530
        PROD_TAG="${DEV_TAG%%-*}"
        
        echo "Retagging $DOCKER_REPO_USER/$IMAGE_NAME:$DEV_TAG → $PROD_TAG"
        
        docker pull "$DOCKER_REPO_USER/$IMAGE_NAME:$DEV_TAG"
        docker tag "$DOCKER_REPO_USER/$IMAGE_NAME:$DEV_TAG" "$DOCKER_REPO_USER/$IMAGE_NAME:latest"
        docker tag "$DOCKER_REPO_USER/$IMAGE_NAME:$DEV_TAG" "$DOCKER_REPO_USER/$IMAGE_NAME:$PROD_TAG"
        
        docker push "$DOCKER_REPO_USER/$IMAGE_NAME:latest"
        docker push "$DOCKER_REPO_USER/$IMAGE_NAME:$PROD_TAG"
        
        echo "prod_tag=$PROD_TAG" >> $GITHUB_OUTPUT
        echo "✅ Image retagged: $PROD_TAG"
